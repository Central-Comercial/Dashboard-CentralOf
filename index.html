<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠️ ALERTA</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Consolas, monospace;
    background: #b00000;
    color: #fff;
    animation: parpadeo 0.6s infinite alternate;
    text-align: center;
  }
  @keyframes parpadeo {
    from { background: #b00000; }
    to   { background: #ff1a1a; }
  }
  .caja { padding: 30px; max-width: 600px; }
  h1 { font-size: 3em; margin: 0 0 10px; }
  .barra { width: 100%; height: 25px; background: #400; border: 2px solid #fff; margin: 20px 0; }
  .progreso { height: 100%; width: 0; background: #fff; transition: width 0.1s; }
  #log { font-size: 0.9em; min-height: 1.5em; }
  .broma { display: none; }
  body.revelado { background: #1a8f3a; animation: none; }
  body.revelado .alerta { display: none; }
  body.revelado .broma { display: block; }
  .broma h1 { font-size: 3.5em; }
</style>
</head>
<body>
  <div class="caja">
    <div class="alerta">
      <h1>⚠️ ALERTA VIRUS ⚠️</h1>
      <p>Se detectaron <b id="num">0</b> archivos infectados</p>
      <div class="barra"><div class="progreso" id="prog"></div></div>
      <p id="log">Iniciando escaneo...</p>
    </div>
    <div class="broma">
      <h1>😂 ¡ES BROMA!</h1>
      <p>Tu computadora está perfectamente bien.</p>
      <p>Caíste 🤡</p>
    </div>
  </div>

<script>
  const mensajes = [
    "Escaneando fotos vergonzosas...",
    "Revisando historial de búsqueda... 👀",
    "Virus.exe copiando memes...",
    "Enviando tus playlists a tu jefe...",
    "Borrando la tarea... (mentira)",
    "Casi terminado..."
  ];
  let p = 0;
  const intervalo = setInterval(() => {
    p += 2;
    document.getElementById("prog").style.width = p + "%";
    document.getElementById("num").textContent = Math.floor(p * 13.37);
    document.getElementById("log").textContent = mensajes[Math.min(Math.floor(p / 17), mensajes.length - 1)];
    if (p >= 100) {
      clearInterval(intervalo);
      setTimeout(() => document.body.classList.add("revelado"), 800);
    }
  }, 100);
</script>
</body>
</html>
